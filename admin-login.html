<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة — Bor</title><style>body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;display:grid;min-height:100vh;place-items:center;color:#172033}.card{background:white;padding:26px;border-radius:16px;box-shadow:0 8px 30px #0001;width:min(90%,390px);box-sizing:border-box}input,button{width:100%;padding:13px;margin-top:12px;border-radius:9px;box-sizing:border-box;font-size:16px}input{border:1px solid #cbd5e1}button{border:0;background:#2563eb;color:white;cursor:pointer}#msg{white-space:pre-wrap;color:#b91c1c}</style></head><body><main class="card"><h1>🔐 دخول الإدارة</h1><p>هذه الصفحة مخصصة لمسؤول المنصة.</p><form id="f"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور الإدارة" required><button id="b">دخول</button></form><p id="msg" role="status"></p><a href="/">العودة إلى التطبيق</a></main><script>const f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;m.textContent='جارٍ التحقق...';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تسجيل الدخول');location.href='/admin';}catch(err){m.textContent=err.message||'حدث خطأ';}finally{b.disabled=false;}});</script></body></html>
