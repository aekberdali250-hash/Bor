<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reward App Admin</title><style>body{font-family:Arial;background:#eef2f7;margin:0}header{background:#111827;color:white;text-align:center;padding:22px}main{max-width:900px;margin:25px auto;padding:15px}.grid{display:flex;gap:15px;flex-wrap:wrap}.card{background:white;padding:20px;margin:10px 0;border-radius:16px;box-shadow:0 4px 18px #0001}.stat{flex:1;min-width:160px}.num{font-size:30px;font-weight:bold}input{padding:11px;margin:4px;border:1px solid #ddd;border-radius:9px}button{padding:11px;background:#2563eb;color:white;border:0;border-radius:9px}a{color:#2563eb}</style></head><body><header><h1>⚙️ لوحة الإدارة</h1></header><main><div class="grid"><div class="card stat">المستخدمون<div id="users" class="num">0</div></div><div class="card stat">الشركات<div id="cc" class="num">0</div></div><div class="card stat">النقاط<div id="points" class="num">0</div></div></div><div class="card"><h2>إضافة شركة</h2><input id="name" placeholder="اسم الشركة"><input id="type" placeholder="النوع"><button onclick="add()">إضافة</button><p id="msg"></p></div><div class="card"><h2>الشركات</h2><div id="list"></div></div><a href="/">← التطبيق</a></main><script>async function load(){const s=await fetch('/api/stats').then(r=>r.json());users.textContent=s.users;cc.textContent=s.companies;points.textContent=s.totalPoints;const c=await fetch('/api/companies').then(r=>r.json());list.innerHTML=c.map(x=>`<p>🏢 ${x.name} — ${x.type}</p>`).join('')}async function add(){const n=name.value.trim(),t=type.value.trim();if(!n)return msg.textContent='أدخل اسم الشركة';const r=await fetch('/api/companies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,type:t})});msg.textContent=r.ok?'تمت الإضافة':'حدث خطأ';name.value='';type.value='';load()}load()</script></body></html>
