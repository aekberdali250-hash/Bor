<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bor Reward App — الإدارة</title><style>body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;color:#172033}header{background:#111827;color:white;text-align:center;padding:22px}main{max-width:900px;margin:25px auto;padding:15px}.grid{display:flex;gap:15px;flex-wrap:wrap}.card{background:white;padding:20px;margin:10px 0;border-radius:16px;box-shadow:0 4px 18px #0001}.stat{flex:1;min-width:160px}.num{font-size:30px;font-weight:bold}input,select{padding:11px;margin:4px;border:1px solid #ddd;border-radius:9px;max-width:100%}button{padding:11px;background:#2563eb;color:white;border:0;border-radius:9px;cursor:pointer}a{color:#2563eb}.company{padding:10px;border-bottom:1px solid #eee}#msg{white-space:pre-wrap}</style></head><body><header><h1>⚙️ لوحة الإدارة</h1><p>إحصائيات المنصة والشركات</p><button id="logout" type="button">تسجيل الخروج</button></header><main><div class="grid"><div class="card stat">المستخدمون<div id="users" class="num">—</div></div><div class="card stat">الشركات<div id="cc" class="num">—</div></div><div class="card stat">إجمالي النقاط الممنوحة<div id="points" class="num">—</div></div></div><div class="card"><h2>إضافة شركة</h2><form id="addForm"><input id="name" maxlength="100" placeholder="اسم الشركة" required><select id="type"><option>Offerwall</option><option>Survey</option><option>Ads</option><option>Tasks</option></select><button type="submit">إضافة</button></form><p id="msg" role="status"></p></div><div class="card"><h2>الشركات</h2><div id="list">جارٍ التحميل...</div></div><a href="/">← العودة إلى التطبيق</a></main><script>
const $=id=>document.getElementById(id);
async function load(){try{const [sr,cr]=await Promise.all([fetch('/api/stats', {credentials:'same-origin'}),fetch('/api/companies', {credentials:'same-origin'})]);if(!sr.ok||!cr.ok)throw new Error('تعذر جلب البيانات من الخادم.');const s=await sr.json(),companies=await cr.json();$('users').textContent=s.users??0;$('cc').textContent=s.companies??companies.length;$('points').textContent=s.totalPoints??s.rewards??0;const box=$('list');box.replaceChildren();if(!companies.length){box.textContent='لا توجد شركات.';return;}for(const c of companies){const row=document.createElement('div');row.className='company';row.textContent='🏢 '+c.name+' — '+c.type+' — '+(c.status?'نشط':'متوقف');box.append(row);}}catch(e){$('list').textContent=e.message||'حدث خطأ أثناء التحميل.';}}
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('name').value.trim();if(!name){$('msg').textContent='أدخل اسم الشركة.';return;}try{const r=await fetch('/api/companies',{credentials:'same-origin',method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type:$('type').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذرت إضافة الشركة.');$('msg').textContent='تمت إضافة الشركة.';$('name').value='';await load();}catch(err){$('msg').textContent=err.message||'حدث خطأ.';}});$('logout').addEventListener('click',async()=>{try{await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});}finally{location.href='/admin/login';}});load();
</script></body></html>
