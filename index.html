<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bor Reward App</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:white;text-align:center;padding:28px 16px}header h1{margin:0 0 8px}main{max-width:850px;margin:22px auto;padding:0 14px}.card{background:#fff;padding:20px;margin:14px 0;border-radius:16px;box-shadow:0 5px 22px #0f172a12}input{display:block;width:100%;padding:13px;margin:10px 0;border:1px solid #dbe2ef;border-radius:10px;font-size:16px}button{padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.company{padding:12px;border:1px solid #e5eaf3;border-radius:10px;margin:8px 0}.muted{color:#64748b}a{color:#2563eb}
</style></head>
<body><header><h1>🎁 Bor Reward App</h1><p>منصة المهام والمكافآت</p></header>
<main>
<section class="card"><h2>إنشاء حساب</h2><p class="muted">أدخل اسمك وبريدك الإلكتروني لإنشاء حساب تجريبي على المنصة.</p>
<form id="registerForm"><input id="name" maxlength="100" placeholder="الاسم" autocomplete="name" required><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required><button id="registerButton" type="submit">إنشاء الحساب</button></form><p id="msg" role="status"></p></section>
<section class="card"><h2>الشركات المتاحة</h2><div id="companies">جارٍ التحميل...</div></section>
<section class="card"><a href="/admin">⚙️ لوحة الإدارة</a></section>
</main>
<script>
const $=id=>document.getElementById(id);
$('registerForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('registerButton');button.disabled=true;$('msg').textContent='جارٍ إنشاء الحساب...';try{const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),email:$('email').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر إنشاء الحساب');$('msg').textContent='تم إنشاء الحساب بنجاح. رقم حسابك: '+(d.user?.id??'—');$('registerForm').reset();}catch(err){$('msg').textContent=err.message||'حدث خطأ في الاتصال.';}finally{button.disabled=false;}});
async function loadCompanies(){const box=$('companies');try{const r=await fetch('/api/companies');if(!r.ok)throw new Error();const data=await r.json();box.replaceChildren();if(!Array.isArray(data)||!data.length){box.textContent='لا توجد شركات متاحة حاليًا.';return;}for(const c of data){const item=document.createElement('div');item.className='company';const title=document.createElement('strong');title.textContent='🏢 '+(c.name||'شركة');const details=document.createElement('p');details.className='muted';details.textContent=(c.type||'Offerwall')+' — '+(c.status?'نشط':'متوقف');item.append(title,details);box.append(item);}}catch(_){box.textContent='تعذر تحميل الشركات. حاول تحديث الصفحة.';}}
loadCompanies();
</script></body></html>
