<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reward App</title><style>body{font-family:Arial;background:#f4f7fb;margin:0}header{background:#2563eb;color:white;text-align:center;padding:22px}main{max-width:850px;margin:25px auto;padding:15px}.card{background:white;padding:22px;margin:15px 0;border-radius:16px;box-shadow:0 4px 18px #0001}input{display:block;width:90%;padding:12px;margin:8px;border:1px solid #ddd;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:white}a{color:#2563eb}</style></head><body><header><h1>🎁 Reward App</h1><p>منصة المكافآت</p></header><main><div class="card"><h2>إنشاء حساب</h2><input id="name" placeholder="الاسم"><input id="email" placeholder="البريد الإلكتروني"><button onclick="reg()">تسجيل</button><p id="msg"></p></div><div class="card"><h2>الشركات المتاحة</h2><div id="companies">جاري التحميل...</div></div><div class="card"><a href="/admin">⚙️ لوحة الإدارة</a></div></main><script>async function reg(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim();if(!name||!email)return msg.textContent='أدخل الاسم والبريد الإلكتروني';const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email})}),d=await r.json();msg.textContent=r.ok?'تم إنشاء الحساب: '+d.id:d.error}async function load(){const d=await fetch('/api/companies').then(r=>r.json());companies.innerHTML=d.map(c=>`<p>🏢 ${c.name} — ${c.type} — ${c.status?'نشط':'متوقف'}</p>`).join('')}load()</script></body></html>
